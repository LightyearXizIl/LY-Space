name: Publish LY Space Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: publish-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: |
          pnpm --dir desktop install --frozen-lockfile --ignore-scripts
          pnpm --dir desktop/renderer install --frozen-lockfile --ignore-scripts
          pnpm --dir desktop exec node node_modules/electron/install.js

      - name: Verify release version
        working-directory: desktop
        run: pnpm run verify:release

      - name: Build and upload draft release
        working-directory: desktop
        run: pnpm --config.verify-deps-before-run=none run publish:win
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Ensure all release assets uploaded
        shell: pwsh
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # electron-builder 上传大文件偶发漏传（exe/latest.yml/blockmap 每次漏的不一样），
          # 这里校验 release 资产完整性，缺失的立即补传，上传失败则让 CI 失败以便重试。
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $existing = @(gh release view $tag --json assets --jq ".assets[].name" 2>$null)
          $releaseDir = (Resolve-Path "..\release").Path
          $assets = @(
            @{ Name = "LY-Space-Setup-$version.exe"; Local = Join-Path $releaseDir "LY Space Setup $version.exe" },
            @{ Name = "LY-Space-Setup-$version.exe.blockmap"; Local = Join-Path $releaseDir "LY Space Setup $version.exe.blockmap" },
            @{ Name = "latest.yml"; Local = Join-Path $releaseDir "latest.yml" }
          )
          foreach ($item in $assets) {
            if ($existing -contains $item.Name) { Write-Host "已存在: $($item.Name)"; continue }
            if (-not (Test-Path $item.Local)) { Write-Host "::warning::本地缺少文件 $($item.Local)，跳过补传"; continue }
            # GitHub 会把资产名中的空格规范化为连字符，这里用连字符临时文件名上传，保证与 electron-builder 命名一致
            $uploadPath = Join-Path $env:TEMP $item.Name
            Copy-Item $item.Local $uploadPath -Force
            Write-Host "补传缺失资产: $($item.Name)"
            gh release upload $tag $uploadPath --clobber
            $code = $LASTEXITCODE
            Remove-Item $uploadPath -Force -ErrorAction SilentlyContinue
            if ($code -ne 0) { exit $code }
          }
          Write-Host "资产校验完成"

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:GITHUB_REF_NAME --draft=false --latest --title "LY Space $env:GITHUB_REF_NAME"
