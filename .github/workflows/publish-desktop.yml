name: Publish LY Space Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: publish-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: |
          pnpm --dir desktop install --frozen-lockfile --ignore-scripts
          pnpm --dir desktop/renderer install --frozen-lockfile --ignore-scripts
          pnpm --dir desktop exec node node_modules/electron/install.js

      - name: Verify release version
        working-directory: desktop
        run: pnpm run verify:release

      - name: Build local installer
        working-directory: desktop
        run: pnpm --config.verify-deps-before-run=none run pack:win

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title "LY Space $tag" --notes "正在校验发布资产。"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload exact release assets
        shell: pwsh
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先本地打包，再仅向同一个草稿 Release 上传三份命名固定的资产，避免 electron-builder 并行发布生成重复草稿。
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $releaseDir = (Resolve-Path "..\release").Path
          $assets = @(
            @{ Name = "LY-Space-Setup-$version.exe"; Local = Join-Path $releaseDir "LY Space Setup $version.exe" },
            @{ Name = "LY-Space-Setup-$version.exe.blockmap"; Local = Join-Path $releaseDir "LY Space Setup $version.exe.blockmap" },
            @{ Name = "latest.yml"; Local = Join-Path $releaseDir "latest.yml" }
          )
          foreach ($item in $assets) {
            if (-not (Test-Path $item.Local)) { throw "本地缺少必需发布资产: $($item.Local)" }
            # GitHub 会把资产名中的空格规范化为连字符，这里用连字符临时文件名上传，保证与 electron-builder 命名一致
            $uploadPath = Join-Path $env:TEMP $item.Name
            Copy-Item $item.Local $uploadPath -Force
            Write-Host "上传并覆盖资产: $($item.Name)"
            gh release upload $tag $uploadPath --clobber
            $code = $LASTEXITCODE
            Remove-Item $uploadPath -Force -ErrorAction SilentlyContinue
            if ($code -ne 0) { exit $code }
          }
          Write-Host "资产校验完成"

      - name: Verify draft release assets and update manifest
        shell: pwsh
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $releaseDir = (Resolve-Path "..\release").Path
          $installerName = "LY-Space-Setup-$version.exe"
          $required = @($installerName, "$installerName.blockmap", "latest.yml")
          $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw "发布校验只能针对草稿 Release 执行" }
          foreach ($name in $required) {
            $asset = @($release.assets | Where-Object { $_.name -eq $name })
            if ($asset.Count -ne 1 -or [int64]$asset[0].size -le 0) { throw "远程 Release 缺少或损坏资产: $name" }
          }
          $verifyDir = Join-Path $env:RUNNER_TEMP "ly-space-release-verify"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          try {
            foreach ($name in $required) { gh release download $tag --pattern $name --dir $verifyDir --clobber }
            $localInstaller = Join-Path $releaseDir "LY Space Setup $version.exe"
            $remoteInstaller = Join-Path $verifyDir $installerName
            if ((Get-FileHash $localInstaller -Algorithm SHA512).Hash -ne (Get-FileHash $remoteInstaller -Algorithm SHA512).Hash) { throw "远程安装包与本地构建不一致" }
            $manifest = Get-Content (Join-Path $verifyDir "latest.yml") -Raw -Encoding UTF8
            $manifestName = [regex]::Match($manifest, "(?m)^path:\s*(.+)$").Groups[1].Value.Trim()
            $manifestSize = [int64]([regex]::Match($manifest, "(?m)^\s*size:\s*(\d+)$").Groups[1].Value)
            $manifestHash = [regex]::Match($manifest, "(?m)^sha512:\s*(\S+)$").Groups[1].Value
            $hashBytes = [Convert]::FromHexString((Get-FileHash $remoteInstaller -Algorithm SHA512).Hash)
            $actualHash = [Convert]::ToBase64String($hashBytes)
            if ($manifestName -ne $installerName -or $manifestSize -ne (Get-Item $remoteInstaller).Length -or $manifestHash -ne $actualHash) { throw "latest.yml 与远程安装包不匹配" }
          } finally {
            Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 从 CHANGELOG.md 提取本版本段落作为 Release 说明（保持与更新日志一致）
          $tag = $env:GITHUB_REF_NAME
          $changelogPath = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          $changelog = Get-Content $changelogPath -Raw -Encoding UTF8
          $pattern = "(?ms)^## $tag .*?(?=^## v|\z)"
          $notes = [regex]::Match($changelog, $pattern).Value.Trim()
          if (-not $notes) { $notes = "LY Space $tag" }
          gh release edit $tag --draft=false --latest --title "LY Space $tag" --notes $notes
